[project]
name = "token-diet"
version = "0.1.0"
description = "Create a reviewable, token-counted context file from a source tree"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pathspec>=1.1.1",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
token-diet = "token_diet.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
